version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-development:
        patterns: ["*"]
    ignore:
      # Keep local Spark tests aligned with Databricks Runtime 18 LTS (Spark 4.1).
      - dependency-name: pyspark
        versions: [">=4.2.0"]
  - package-ecosystem: terraform
    directory: "/infra/azure"
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: "/infra/databricks"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
