name: Lakehouse CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: src

concurrency:
  group: lakehouse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test code, infrastructure, and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock

      - name: Run Python quality gates
        run: |
          python -m ruff check src tests
          python -m mypy src
          python -m pytest
          python -m build --wheel

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Validate Terraform stacks
        run: |
          terraform fmt -check -recursive infra
          for stack in infra/azure infra/databricks; do
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
          done

      - name: Scan source and infrastructure
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          hide-progress: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
